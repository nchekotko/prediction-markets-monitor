[project]
name = "pmmon"
version = "0.1.0"
description = "Read-only prediction-market monitor: Polymarket/Kalshi adapters, unified schema, cross-venue mapping, order-book recorder, event-time backtester, calibration."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikolay Chekotko" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.7",
    "pyarrow>=16.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
pmmon = "pmmon.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real venue APIs over the network (deselected by default; run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF005"]
